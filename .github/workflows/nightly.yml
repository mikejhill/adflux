name: Nightly
# Slow and networked suites that should not gate every PR: live Jira and Confluence
# round trips and deep property-based fuzzing of the converter.
on:
  schedule:
    - cron: '17 5 * * *'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  live:
    name: Live Jira and Confluence round trips
    runs-on: ubuntu-latest
    timeout-minutes: 30
    # The e2e environment holds the Atlassian credentials and only deploys from main.
    environment: e2e
    env:
      ADFLUX_E2E_ATLASSIAN_SITE: ${{ secrets.ADFLUX_E2E_ATLASSIAN_SITE }}
      ADFLUX_E2E_ATLASSIAN_EMAIL: ${{ secrets.ADFLUX_E2E_ATLASSIAN_EMAIL }}
      ADFLUX_E2E_ATLASSIAN_API_TOKEN: ${{ secrets.ADFLUX_E2E_ATLASSIAN_API_TOKEN }}
      ADFLUX_E2E_CONFLUENCE_SPACE_KEY: ${{ secrets.ADFLUX_E2E_CONFLUENCE_SPACE_KEY }}
      ADFLUX_E2E_CONFLUENCE_PARENT_PAGE_ID: ${{ secrets.ADFLUX_E2E_CONFLUENCE_PARENT_PAGE_ID }}
      ADFLUX_E2E_JIRA_PROJECT_KEY: ${{ secrets.ADFLUX_E2E_JIRA_PROJECT_KEY }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@1db35dd8eee11c5894872e0b383ae6c406cf738d # v10.4.0
        with:
          python-version: '3.14'
          enable-cache: false
      - run: uv sync --locked
      - run: uv run poe test-e2e -rs --junitxml=e2e.xml
      # The suite skips without working credentials so local runs pass; here a skip means
      # Jira or Confluence went untested, which must fail.
      - name: Require every live test to run
        run: uv run python scripts/require_no_skips.py e2e.xml
  deep:
    name: Deep property-based fuzzing
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@1db35dd8eee11c5894872e0b383ae6c406cf738d # v10.4.0
        with:
          python-version: '3.14'
          enable-cache: false
      - run: uv sync --locked
      - run: uv run poe test-deep
