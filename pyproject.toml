[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "adflux"
version = "0.4.0"
description = "Lossless Markdown <-> Atlassian Document Format (ADF) conversion with Jira and Confluence profiles, macros and emoji"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "Mike Hill", email = "mike@mikejhill.com" }]
maintainers = [{ name = "Mike Hill", email = "mike@mikejhill.com" }]
keywords = [
    "markdown",
    "adf",
    "atlassian",
    "atlassian-document-format",
    "commonmark",
    "gfm",
    "converter",
    "document-conversion",
    "confluence",
    "jira",
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "Intended Audience :: Information Technology",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Operating System :: POSIX :: Linux",
    "Operating System :: MacOS",
    "Operating System :: Microsoft :: Windows",
    "Programming Language :: Python",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Programming Language :: Python :: Implementation :: CPython",
    "Topic :: Documentation",
    "Topic :: Software Development :: Documentation",
    "Topic :: Text Processing :: Markup",
    "Topic :: Text Processing :: Markup :: Markdown",
    "Topic :: Utilities",
    "Typing :: Typed",
]
dependencies = [
    "markdown-it-py>=3.0",
    "jsonschema>=4.21",
]

[dependency-groups]
mutation = ["mutmut>=3.8.0,<4; sys_platform != 'win32'"]
dev = [
    "pytest>=9",
    "pytest-cov>=7",
    "hypothesis>=6.100",
    "ruff>=0.14",
    "ty>=0.0.1",
    "types-jsonschema",
    "httpx>=0.27",
    "python-dotenv>=1.0",
    "poethepoet>=0.37",
    "twine>=6",
    "diff-cover>=11.0.1",
]

[project.scripts]
adflux = "adflux.cli:main"

[project.urls]
Homepage = "https://github.com/mikejhill/adflux"
Documentation = "https://github.com/mikejhill/adflux/tree/main/docs"
Repository = "https://github.com/mikejhill/adflux"
Issues = "https://github.com/mikejhill/adflux/issues"
Changelog = "https://github.com/mikejhill/adflux/blob/main/CHANGELOG.md"

[tool.hatch.build.targets.wheel]
packages = ["src/adflux"]

[tool.hatch.build.targets.sdist]
include = [
    "src/**/*.py",
    "src/**/*.json",
    "src/**/*.md",
    "scripts/*.py",
    "tests/**/*.py",
    "tests/**/*.json",
    "docs/**/*",
    "README.md",
    "CHANGELOG.md",
    "LICENSE",
    "pyproject.toml",
]

[tool.pytest.ini_options]
minversion = "8.0"
addopts = ["-ra", "--strict-markers", "--strict-config", "-p", "no:cacheprovider"]
xfail_strict = true
testpaths = ["tests"]
pythonpath = ["src", "."]
markers = [
    "unit: fast, isolated tests of one module (tests/unit)",
    "roundtrip: lossless round trips over live captures and generated documents (tests/roundtrip)",
    "e2e: live Jira and Confluence round trips; skip without credentials (tests/e2e)",
]

[tool.coverage.run]
branch = true
source = ["adflux"]

[tool.coverage.report]
# Statements and branches combined. Baseline 2026-11-21: 84.8%. Raise as coverage grows; never lower.
fail_under = 84
show_missing = true
exclude_also = [
    '^\s*\.\.\.$',
    "raise NotImplementedError",
    "if TYPE_CHECKING:",
]

[tool.mutmut]
source_paths = ["src/adflux/"]
# Generated from the ADF JSON Schema; tests/unit/test_spec.py checks it is fresh.
do_not_mutate = ["src/adflux/adf/_spec.py"]
# Mutants are judged by the hermetic suites; the live e2e suite adds network calls, not signal.
pytest_add_cli_args_test_selection = ["tests/unit/", "tests/roundtrip/"]
pytest_add_cli_args = ["-p", "no:cacheprovider", "-x", "-q"]
also_copy = ["scripts/", "tests/"]
mutate_only_covered_lines = true

[tool.ruff]
line-length = 120
target-version = "py311"
src = ["src", "tests"]
extend-exclude = ["src/adflux/adf/_spec.py", ".tmp", ".venv*", "dist", "mutants", "mutation-report"]

[tool.ruff.lint]
select = [
    "E", "W",    # pycodestyle
    "F",         # pyflakes
    "I",         # isort
    "B",         # bugbear
    "S",         # bandit
    "UP",        # pyupgrade
    "C4",        # comprehensions
    "SIM",       # simplify
    "RET",       # returns
    "PTH",       # pathlib
    "RUF",       # ruff-specific
    "N",         # pep8-naming
    "D",         # pydocstyle
]
ignore = [
    "D100", "D104", "D105", "D107",  # allow missing docstrings on modules/packages/magic/__init__
    "D203", "D213",                   # conflicting with D211/D212
]

[tool.ruff.lint.per-file-ignores]
"tests/**/*.py" = ["D", "S101", "S105", "S106", "S603", "S607", "S311"]
"scripts/**/*.py" = ["S603", "S607"]

[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.ty.src]
include = ["src", "tests", "scripts"]

[tool.ty.environment]
python-version = "3.11"

[tool.ty.rules]
all = "error"
# Empty strings and None are deliberately both "absent" in attribute handling.
truthiness-test-of-none-union = "ignore"
# JSON boundary code narrows `Any` explicitly; these flag every such narrowing.
unsound-return-statement = "ignore"
unsound-assignment = "ignore"
# typing.override needs Python 3.12; adflux supports 3.11.
missing-override-decorator = "ignore"

[tool.poe.tasks]
format = "ruff format ."
format-check = "ruff format --check ."
lint = "ruff check ."
typecheck = "ty check"
# Default gate: unit + round-trip suites with branch coverage (live e2e runs separately).
test = "pytest -m 'not e2e' --cov --cov-report=term-missing --cov-report=xml"
test-unit = "pytest -m unit"
test-roundtrip = "pytest -m roundtrip"
test-e2e = "pytest -m e2e -v"
test-deep = { cmd = "pytest -m roundtrip", env = { HYPOTHESIS_PROFILE = "thorough" } }
# Every changed line on this branch must be covered (CI compares against origin/main).
diff-coverage = "diff-cover coverage.xml --compare-branch=origin/main --fail-under=100"
mutation = "mutmut run --max-children 4"
# Reports the whole-package score; the mutation workflow enforces the per-shard floors.
mutation-score = { shell = "mkdir -p mutation-report && mutmut results --all true > mutation-report/results.txt && python scripts/mutation_score.py --results mutation-report/results.txt --floor 0" }
lint-fix = "ruff check . --fix"
fix = ["format", "lint-fix"]
check = ["format-check", "lint", "typecheck", "test"]
